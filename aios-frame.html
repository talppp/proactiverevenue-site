<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#0D1B2E; width:1200px; height:627px; overflow:hidden; }
  .frame { position:relative; width:1200px; height:627px;
           background:radial-gradient(ellipse at 70% 20%, rgba(127,119,221,0.13), transparent 60%), #0D1B2E; }
  .hdr { position:absolute; top:16px; left:36px; right:36px; }
  h1 { font-family:'EB Garamond',serif; color:#fff; font-size:34px; letter-spacing:1px; margin:0; }
  h1 span { background:linear-gradient(135deg,#1D9E75,#7F77DD); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-family:'DM Sans',sans-serif; color:rgba(255,255,255,.5); font-size:13px; letter-spacing:.4px; margin-top:3px; }
  .brand { position:absolute; bottom:12px; right:36px; font-family:'DM Sans',sans-serif;
           font-size:12px; letter-spacing:2px; color:rgba(255,255,255,.42); }
  .stage { position:absolute; top:74px; left:0; width:1200px; }
  svg { display:block; margin:0 auto; }
  .svg-label { font-family:'DM Sans',sans-serif; font-size:9px; letter-spacing:1px; fill:#AFA9EC; }
  .svg-label-strong { font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:1px; fill:#FFFFFF; }
  .pulse-ring { animation:pulseRing 1.5s ease-out infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes pulseRing { 0%{opacity:.5;transform:scale(.85)} 70%,100%{opacity:0;transform:scale(1.5)} }
</style></head><body>
<div class="frame">
  <div class="hdr">
    <h1>One Business. <span>Fully Orchestrated.</span></h1>
    <div class="sub">Every channel captured &middot; every decision informed &middot; every workflow executed &middot; the system learns from every cycle</div>
  </div>
  <div class="stage"><svg id="g" width="1200" height="573" viewBox="0 0 900 430" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="alg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1D9E75"/><stop offset="100%" stop-color="#7F77DD"/>
        </linearGradient>
      </defs>

      <!-- forward paths: inputs → capture station -->
      <path id="al-in1" d="M112,60 C170,75 195,140 208,175" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
      <path id="al-in2" d="M112,130 C160,145 185,165 205,185" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
      <path id="al-in3" d="M112,200 C150,200 175,200 202,200" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
      <path id="al-in4" d="M112,270 C160,255 185,235 205,215" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
      <path id="al-in5" d="M112,340 C170,325 195,260 208,225" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
      <!-- capture → core -->
      <path id="al-mid" d="M297,200 C330,200 370,200 405,200" fill="none" stroke="url(#alg)" stroke-width="1.2" opacity="0.5"/>
      <!-- core → automations -->
      <path id="al-auto" d="M515,200 C545,200 560,200 583,200" fill="none" stroke="url(#alg)" stroke-width="1.2" opacity="0.5"/>
      <!-- automations → outputs -->
      <path id="al-out1" d="M688,185 C730,160 760,110 788,92" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.35"/>
      <path id="al-out2" d="M688,200 C730,195 755,185 786,180" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.35"/>
      <path id="al-out3" d="M688,215 C725,240 745,275 765,300" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.35"/>
      <!-- learning feedback loop -->
      <path id="al-loop" d="M830,335 C740,405 400,415 255,400 C185,392 190,300 218,235"
            fill="none" stroke="#AFA9EC" stroke-width="1.2" opacity="0.4" stroke-dasharray="5 6"/>

      <!-- input nodes -->
      <circle cx="82" cy="60" r="24" fill="#0A2240" stroke="#1D9E75" stroke-width="1"/>
      <text x="82" y="64" text-anchor="middle" class="svg-label">LEADS</text>
      <circle cx="82" cy="130" r="24" fill="#0A2240" stroke="#1D9E75" stroke-width="1"/>
      <text x="82" y="134" text-anchor="middle" class="svg-label">CALLS</text>
      <circle cx="82" cy="200" r="24" fill="#0A2240" stroke="#1D9E75" stroke-width="1"/>
      <text x="82" y="204" text-anchor="middle" class="svg-label">ORDERS</text>
      <circle cx="82" cy="270" r="24" fill="#0A2240" stroke="#1D9E75" stroke-width="1"/>
      <text x="82" y="274" text-anchor="middle" class="svg-label">SUPPORT</text>
      <circle cx="82" cy="340" r="24" fill="#0A2240" stroke="#1D9E75" stroke-width="1"/>
      <text x="82" y="344" text-anchor="middle" class="svg-label">INVOICES</text>

      <!-- capture station -->
      <rect x="205" y="170" width="92" height="60" rx="10" fill="#0A2240" stroke="#1D9E75" stroke-width="1.2"/>
      <text x="251" y="195" text-anchor="middle" class="svg-label-strong">CONTEXT + DATA</text>
      <text x="251" y="210" text-anchor="middle" class="svg-label">EVERYTHING CAPTURED</text>

      <!-- AIOS core -->
      <circle cx="460" cy="200" r="72" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.35" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" values="0 460 200;360 460 200" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle class="pulse-ring" cx="460" cy="200" r="56" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
      <circle cx="460" cy="200" r="52" fill="url(#alg)"/>
      <text x="460" y="192" text-anchor="middle" class="svg-label-strong" style="font-size:16px;letter-spacing:3px">AIOS</text>
      <text x="460" y="210" text-anchor="middle" class="svg-label-strong" style="font-size:9px">INTELLIGENCE</text>
      <text x="460" y="222" text-anchor="middle" class="svg-label-strong" style="font-size:8px;opacity:0.8">ANALYZES · DECIDES</text>

      <!-- automations station -->
      <rect x="585" y="170" width="104" height="60" rx="10" fill="#0A2240" stroke="#7F77DD" stroke-width="1.2"/>
      <text x="637" y="195" text-anchor="middle" class="svg-label-strong">AUTOMATIONS</text>
      <text x="637" y="210" text-anchor="middle" class="svg-label">EXECUTE 24/7</text>

      <!-- output nodes -->
      <rect x="788" y="72" width="86" height="34" rx="8" fill="#0A2240" stroke="#7F77DD" stroke-width="1"/>
      <text x="831" y="87" text-anchor="middle" class="svg-label">MORNING</text>
      <text x="831" y="99" text-anchor="middle" class="svg-label">BRIEFINGS</text>
      <rect x="788" y="160" width="86" height="34" rx="8" fill="#0A2240" stroke="#7F77DD" stroke-width="1"/>
      <text x="831" y="175" text-anchor="middle" class="svg-label">FOLLOW-UPS</text>
      <text x="831" y="187" text-anchor="middle" class="svg-label">&amp; REPORTS</text>

      <!-- revenue bars -->
      <rect x="775" y="342" width="14" height="18" rx="2" fill="url(#alg)" opacity="0.85">
        <animate attributeName="height" values="10;18;10" dur="1.5s" repeatCount="indefinite" begin="0.00s"/>
        <animate attributeName="y" values="350;342;350" dur="1.5s" repeatCount="indefinite" begin="0.00s"/>
      </rect>
      <rect x="795" y="332" width="14" height="28" rx="2" fill="url(#alg)" opacity="0.9">
        <animate attributeName="height" values="16;28;16" dur="1.5s" repeatCount="indefinite" begin="0.40s"/>
        <animate attributeName="y" values="344;332;344" dur="1.5s" repeatCount="indefinite" begin="0.40s"/>
      </rect>
      <rect x="815" y="320" width="14" height="40" rx="2" fill="url(#alg)" opacity="0.95">
        <animate attributeName="height" values="24;40;24" dur="1.5s" repeatCount="indefinite" begin="0.80s"/>
        <animate attributeName="y" values="336;320;336" dur="1.5s" repeatCount="indefinite" begin="0.80s"/>
      </rect>
      <rect x="835" y="306" width="14" height="54" rx="2" fill="url(#alg)">
        <animate attributeName="height" values="34;54;34" dur="1.5s" repeatCount="indefinite" begin="1.20s"/>
        <animate attributeName="y" values="326;306;326" dur="1.5s" repeatCount="indefinite" begin="1.20s"/>
      </rect>
      <text x="822" y="378" text-anchor="middle" class="svg-label" style="fill:#9FE1CB">REVENUE COMPOUNDING</text>

      <!-- forward dots -->
      <circle r="4" fill="#9FE1CB"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.00s"><mpath href="#al-in1"/></animateMotion></circle>
      <circle r="4" fill="#9FE1CB"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.50s"><mpath href="#al-in2"/></animateMotion></circle>
      <circle r="4" fill="#9FE1CB"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.00s"><mpath href="#al-in3"/></animateMotion></circle>
      <circle r="4" fill="#9FE1CB"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.50s"><mpath href="#al-in4"/></animateMotion></circle>
      <circle r="4" fill="#9FE1CB"><animateMotion dur="1.5s" repeatCount="indefinite" begin="2.00s"><mpath href="#al-in5"/></animateMotion></circle>
      <circle r="4.5" fill="#9FE1CB"><animateMotion dur="0.75s" repeatCount="indefinite" begin="0.30s"><mpath href="#al-mid"/></animateMotion></circle>
      <circle r="4.5" fill="#AFA9EC"><animateMotion dur="0.75s" repeatCount="indefinite" begin="0.90s"><mpath href="#al-auto"/></animateMotion></circle>
      <circle r="4" fill="#AFA9EC"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.00s"><mpath href="#al-out1"/></animateMotion></circle>
      <circle r="4" fill="#AFA9EC"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.70s"><mpath href="#al-out2"/></animateMotion></circle>
      <circle r="4" fill="#AFA9EC"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.40s"><mpath href="#al-out3"/></animateMotion></circle>
      <!-- learning loop dots -->
      <circle r="4.5" fill="#AFA9EC"><animateMotion dur="3s" repeatCount="indefinite" begin="0.00s"><mpath href="#al-loop"/></animateMotion></circle>
      <circle r="4.5" fill="#AFA9EC"><animateMotion dur="3s" repeatCount="indefinite" begin="0.00s"><mpath href="#al-loop"/></animateMotion></circle>

      <text x="450" y="424" text-anchor="middle" class="svg-label" style="font-size:11px;fill:#AFA9EC">LEARNING LOOP — EVERY OUTCOME FLOWS BACK · THE SYSTEM GETS SMARTER EVERY CYCLE</text>
    </svg></div>
  <div class="brand">PROACTIVEREVENUE.COM</div>
</div>
<script>
  var t = parseFloat((location.hash.match(/t=([\d.]+)/)||[])[1] || 0);
  var svg = document.getElementById('g');
  svg.pauseAnimations(); svg.setCurrentTime(t);
  document.querySelectorAll('.pulse-ring').forEach(function(el){
    el.style.animationDelay = (-t) + 's';
    el.style.animationPlayState = 'paused';
  });
  document.title = 'f' + t;
</script>
</body></html>
